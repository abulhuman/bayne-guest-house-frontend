name: Deploy on-prem
on:
  # Merging to main builds and tests. Production deploys a v* release tag.
  # Re-run on an older tag to roll back: gh workflow run "Deploy on-prem" --ref v1.2.3
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run existing tests
        run: node --test lib/*.test.mjs
      - name: Check preview isolation and DNS ownership
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A PR image goes through GHCR, so the host pulls only the layers it lacks. A release
      # builds on the host instead, so here it only has to build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: NEXT_PUBLIC_API_BASE=${{ github.event_name == 'pull_request' && '/api' || 'https://api.almishotel.com' }}
          push: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number || 'none' }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, bayne-frontend]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      pull-requests: write
    concurrency:
      group: bayne-frontend-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    steps:
      - name: Ignore obsolete deployments
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
              core.setOutput('deploy', pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha);
            } else {
              // A release must be a commit that main already contains.
              const {data: diff} = await github.rest.repos.compareCommits({...context.repo, base: 'main', head: context.sha});
              if (!['identical', 'behind'].includes(diff.status)) {
                core.setFailed(`${context.ref} points at ${context.sha}, which is not on main.`);
                return;
              }
              core.setOutput('deploy', true);
            }
      # Only a release may update the host deployment script. PR jobs never check out
      # or execute PR shell/Python code on this persistent runner.
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true' && github.event_name != 'pull_request'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install deployment scripts from the release
        if: steps.current.outputs.deploy == 'true' && github.event_name != 'pull_request'
        run: python3 deploy/manage.py prepare
      # Build where the image runs. The host's connection could not download even a
      # 73 MB image artifact within the job limit.
      - name: Build the release image
        if: steps.current.outputs.deploy == 'true' && github.event_name != 'pull_request'
        run: docker build --build-arg NEXT_PUBLIC_API_BASE=https://api.almishotel.com -t "bayne-frontend:$GITHUB_SHA" .
      - name: Pull the preview image
        if: steps.current.outputs.deploy == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:pr-$PR_NUMBER-$GITHUB_SHA"
          # A private config keeps the registry token off the runner's shared Docker config.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-$PR_NUMBER"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          docker tag "$image" "bayne-frontend:pr-$PR_NUMBER-$GITHUB_SHA"
      - name: Deploy image
        if: steps.current.outputs.deploy == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 "$HOME/.local/share/bayne/frontend/manage.py" preview --pr "$PR_NUMBER" --image "bayne-frontend:pr-$PR_NUMBER-$GITHUB_SHA"
          else
            python3 "$HOME/.local/share/bayne/frontend/manage.py" main --image "bayne-frontend:$GITHUB_SHA"
          fi
      - name: Publish preview URL
        if: steps.current.outputs.deploy == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- bayne-frontend-preview -->';
            const body = `${marker}\nPreview: https://pr-${context.issue.number}.almishotel.com\nUses a separate API and disposable database.`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: context.issue.number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bayne-frontend]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      pull-requests: read
    concurrency:
      group: bayne-frontend-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check that the PR is still closed
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            core.setOutput('closed', pr.state === 'closed');
      - name: Remove preview, DNS, credentials, and disposable database
        if: steps.current.outputs.closed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 "$HOME/.local/share/bayne/frontend/manage.py" remove-preview --pr "$PR_NUMBER"
          # Drop both tags the deploy step created, or the image stays on disk.
          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E "^(ghcr.io/$GITHUB_REPOSITORY|bayne-frontend):pr-$PR_NUMBER-" | xargs -r docker image rm
      - name: Delete closed PRs' images from the registry
        if: steps.current.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          versions="users/$OWNER/packages/container/$PACKAGE/versions"
          # List every page before deleting, or deletions shift versions into pages already read.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq '.[].number' > "$RUNNER_TEMP/open-prs"
          gh api --paginate "$versions" --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' \
            > "$RUNNER_TEMP/versions"
          # Delete every closed PR's versions, but GHCR refuses to delete the last tagged one,
          # so keep the newest when nothing else would remain.
          ids=$(python3 - "$RUNNER_TEMP/open-prs" "$RUNNER_TEMP/versions" <<'EOF'
          import re, sys
          open_prs = set(open(sys.argv[1]).read().split())
          tagged = [line.rstrip('\n').split('\t') for line in open(sys.argv[2]) if line.split('\t')[1].strip()]
          def closed(tags):
              return any((m := re.match(r'pr-(\d+)-', tag)) and m[1] not in open_prs for tag in tags.split(','))
          stale = [id for id, tags in tagged if closed(tags)]
          print('\n'.join(stale[1:] if len(stale) == len(tagged) else stale))
          EOF
          )
          for id in $ids; do gh api -X DELETE "$versions/$id"; done
