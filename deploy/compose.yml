# The backend stack owns Traefik and cloudflared. This stack joins its network.
name: bayne-frontend
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${EDGE_NETWORK:-almis-edge}
      traefik.http.routers.bayne-frontend.rule: Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      traefik.http.routers.bayne-frontend.entrypoints: web
      traefik.http.services.bayne-frontend.loadbalancer.server.port: "3000"
    networks: [edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-almis-edge}
